name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Check the dependency lock is current
        run: |
          uv pip compile backend/requirements.txt --generate-hashes \
            --python-platform linux --python-version 3.12 -o /tmp/expected.lock --quiet
          if ! diff <(grep -v '^#' backend/requirements.lock.txt) \
                    <(grep -v '^#' /tmp/expected.lock) > /dev/null; then
            echo '::error::requirements.lock.txt does not match requirements.txt.'
            echo 'Regenerate it with:'
            echo '  cd backend && uv pip compile requirements.txt --generate-hashes \'
            echo '      --python-platform linux --python-version 3.12 -o requirements.lock.txt'
            exit 1
          fi
          echo 'Lock is current.'

      - name: Install dependencies
        run: "uv pip install --system --only-binary :all: --require-hashes -r backend/requirements.lock.txt"
      - name: Install test-only tools
        run: "uv pip install --system pytest httpx"

      - name: Run backend test suite
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Install backend deps
        run: "uv pip install --system --only-binary :all: --require-hashes -r backend/requirements.lock.txt"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
