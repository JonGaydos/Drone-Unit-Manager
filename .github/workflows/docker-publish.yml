name: Build and Publish Docker Image

on:
  push:
    branches: [main, v2-security-fixes, v3-redesign]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # cosign keyless OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Release channels.
          #   :latest and :X.Y.Z  a cut release, from a v* tag. What a
          #                       production deployment should track.
          #   :main               every merge to main. The staging channel.
          #   :<short-sha>        every build, for pinning to an exact commit.
          #
          # latest deliberately does NOT follow main. It used to, which meant
          # any merge reached a production container on its next pull, with no
          # step in between where a human decided to ship.
          # metadata-action defaults to flavor: latest=auto, which adds latest
          # on the default branch on its own, ignoring the rule below. Without
          # this the explicit rule is dead letter and latest keeps following main.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build Docker image (load, no push)
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report-only: surfaces HIGH+CRITICAL in the run log but never fails the
      # build (so signing/SBOM always run). Kept for visibility alongside the
      # blocking gate below.
      - name: Scan image for vulnerabilities (Trivy, report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
        continue-on-error: true

      # Blocking gate: a fixable CRITICAL fails the run BEFORE the push, so a
      # vulnerable image is never published. Scans the locally loaded image.
      - name: Trivy gate (block on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Push Docker image
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR requires a lowercase image path; github.repository can contain
      # uppercase (e.g. JonGaydos/...). The build/Trivy steps use the
      # metadata-action's auto-lowercased tags; cosign/SBOM need it lowercased here.
      - name: Lowercase image ref
        run: echo "IMAGE_LC=${IMG,,}" >> "$GITHUB_ENV"
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image (keyless)
        run: cosign sign --yes ${{ env.IMAGE_LC }}@${{ steps.push.outputs.digest }}

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ env.IMAGE_LC }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          upload-artifact: true
