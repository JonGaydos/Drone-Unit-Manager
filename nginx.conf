server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    location /api {
        proxy_pass http://localhost:8000;
        # Long-running admin operations answer on this path: a full backup
        # builds the whole archive before responding, reports render PDFs,
        # and a flight import geocodes launch addresses at 1/sec. nginx's
        # 60s default read timeout cut all of those off mid-flight.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: the app is served over HTTPS via Cloudflare. 6 months, no
    # includeSubDomains/preload to keep it conservative and reversible.
    add_header Strict-Transport-Security "max-age=15768000" always;
    # CSP enforcing. Verified clean in Report-Only (no violations across
    # dashboard, flight map, calendar, weather, reports, settings).
    # style-src unsafe-inline covers React inline styles;
    # img-src https:/data:/blob: covers Leaflet tiles + generated thumbnails.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx does not inherit server-level add_header into a location that
        # declares its own, so re-declare the security headers here.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    }

    location / {
        root /app/static;
        try_files $uri $uri/ /index.html;
    }
}
