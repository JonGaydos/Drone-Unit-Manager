# SonarCloud auto-analysis config. UI-level settings (org, projectKey)
# stay on sonarcloud.io; this file only overrides what we want pinned in
# version control.

# Pin to the Python the runtime container uses (python:3.12-slim in
# Dockerfile). Removes the "compatible with all Python 3 versions"
# warning and lets Sonar apply 3.12-specific rules.
sonar.python.version=3.12

# NOTE: verified empirically that SonarCloud's Automatic Analysis does not
# apply sonar.exclusions or sonar.issue.ignore.* from this file. The
# migrations exclusion below leaves all six of its findings reported, and
# the three issue suppressions had no effect on a pull request. They are
# kept because they are correct, they document the decisions, and they take
# effect the moment analysis moves to the CI scanner, which would also give
# SonarCloud the coverage data it currently shows as 'No data'.
#
# Until then the only mechanism that actually suppresses an issue is marking
# it Won't Fix in the SonarCloud UI, which is per-project and was lost when
# the project was recreated.
# --- Deliberate exceptions -------------------------------------------------
# Kept here rather than dismissed in the SonarCloud UI, because per-issue
# dismissals live only in the server's project and were lost wholesale when the
# project was recreated. This file is versioned and survives that.

sonar.issue.ignore.multicriteria=dronePlacesKeys,gpxNamespace,containerRoot,pipHashes

# javascript:S6479, array index in keys. dronePlaces is a plain string[], both
# in React state and in the drone_location_places setting it round-trips
# through, so the entries have no identity of their own; the position is the
# identity. Giving them synthetic ids purely to satisfy the rule would mean
# converting at both persistence boundaries, in code no test covers.
sonar.issue.ignore.multicriteria.dronePlacesKeys.ruleKey=javascript:S6479
sonar.issue.ignore.multicriteria.dronePlacesKeys.resourceKey=**/pages/SettingsPage.jsx



# python:S5332, http:// in export.py. This is the GPX 1.1 XML namespace

# identifier, http://www.topografix.com/GPX/1/1, which the specification

# defines as that exact string. It is never fetched. Changing it to https

# produces a document that GPX parsers reject, so this is a false positive

# and 'fixing' it would break every track export.

sonar.issue.ignore.multicriteria.gpxNamespace.ruleKey=python:S5332

sonar.issue.ignore.multicriteria.gpxNamespace.resourceKey=**/routers/export.py



# docker:S6471, the image runs as root. Genuine hardening and worth doing,

# but not as part of a sweep: the container writes to a bind-mounted data

# directory whose existing files are root-owned, so adding a USER without

# also handling ownership leaves an app that starts and then cannot write.

# That needs its own change, with a tested rollback, on a deployment that

# already holds live data.

sonar.issue.ignore.multicriteria.containerRoot.ruleKey=docker:S6471

sonar.issue.ignore.multicriteria.containerRoot.resourceKey=**/Dockerfile



# Alembic revisions are a historical record of schema changes that have

# already run against production databases. Their value is that they still

# say what actually happened, so they are not edited to satisfy style rules

# and there is no point reporting on them.

sonar.exclusions=backend/migrations/versions/**



# docker:S8544 and githubactions:S8544, dependencies not locked to resolved

# versions. requirements.txt pins all 18 direct dependencies with ==, the

# base images are pinned by digest, and --only-binary :all: means no

# setup.py runs at build time. What the rule actually wants on top of that

# is hash pinning, which needs a generated lockfile covering every

# transitive dependency, and adopting one changes how dependencies are

# managed for the project. Worth doing, deliberately, not folded into a

# cleanup.

sonar.issue.ignore.multicriteria.pipHashes.ruleKey=*:S8544

sonar.issue.ignore.multicriteria.pipHashes.resourceKey=**/*

