# SonarCloud auto-analysis config. UI-level settings (org, projectKey)
# stay on sonarcloud.io; this file only overrides what we want pinned in
# version control.

# Pin to the Python the runtime container uses (python:3.12-slim in
# Dockerfile). Removes the "compatible with all Python 3 versions"
# warning and lets Sonar apply 3.12-specific rules.
sonar.python.version=3.12
